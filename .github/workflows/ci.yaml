name: CI

on:
  push:
    branches: [v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Analyze
        run: dart run melos analyze

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Set up QuickJS native library
        run: dart run melos setup:quickjs

      - name: Test
        run: dart run melos test