name: Setup
description: Install Flutter and Melos, then bootstrap the workspace

runs:
  using: composite
  steps:
    - name: Read versions
      id: versions
      shell: bash
      run: |
        flutter_version=$(jq -r '.flutter' .fvmrc)
        melos_version=$(awk '/^  melos:$/{f=1} f && /^    version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
        if [ -z "$flutter_version" ] || [ "$flutter_version" = "null" ]; then
          echo "Could not read Flutter version from .fvmrc" >&2; exit 1
        fi
        if [ -z "$melos_version" ]; then
          echo "Could not read Melos version from pubspec.lock" >&2; exit 1
        fi
        echo "flutter=$flutter_version" >> "$GITHUB_OUTPUT"
        echo "melos=$melos_version" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.versions.outputs.flutter }}
        cache: true

    - name: Install Melos
      shell: bash
      run: dart pub global activate melos ${{ steps.versions.outputs.melos }}

    - name: Bootstrap
      shell: bash
      run: dart run melos bootstrap